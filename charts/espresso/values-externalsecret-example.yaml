# Example values for using the External Secrets Operator with the Espresso chart.
# The External Secrets Operator and CRDs must already be installed in the cluster.

externalSecret:
  enabled: true
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: customer-secret-store
    kind: ClusterSecretStore
  targetSecretName: espresso-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: espresso/postgres
        property: password
    - secretKey: ESPRESSO_UI_API_PASSWORD_SALT
      remoteRef:
        key: espresso/ui-backend
        property: passwordSalt
    - secretKey: ESPRESSO_UI_API_PRIVATE_KEY
      remoteRef:
        key: espresso/ui-backend
        property: privateKey

# Reference the Kubernetes Secret created by the ExternalSecret from the normal
# chart settings.
db:
  postgres:
    existingSecret: espresso-secrets
    passwordSecretKey: POSTGRES_PASSWORD

espresso:
  uiBackend:
    existingSecret: espresso-secrets
    passwordSaltSecretKey: ESPRESSO_UI_API_PASSWORD_SALT
    privateKeySecretKey: ESPRESSO_UI_API_PRIVATE_KEY
