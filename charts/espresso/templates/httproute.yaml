{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "espresso.fullname" . }}-http
  labels:
    {{- include "espresso.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      {{- if .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace | quote }}
      {{- end }}
      {{- if .Values.gateway.sectionName }}
      sectionName: {{ .Values.gateway.sectionName | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: espresso-backend
          port: 8088
{{- if .Values.espresso.scim.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /scim
      backendRefs:
        - name: espresso-scim
          port: 8109
{{- end }}
{{- if eq .Values.espresso.interface "REST" }}
    - matches:
        - path:
            type: PathPrefix
            value: /rest/v1
      backendRefs:
        - name: espresso-rest-gateway
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /rest/v2
      backendRefs:
        - name: espresso-rest-gateway
          port: 80
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: espresso-frontend
          port: 80
{{- end }}
