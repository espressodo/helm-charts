{{- include "espresso.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "espresso.fullname" . }}-config
  labels:
    {{- include "espresso.labels" . | nindent 4 }}
data:
  ESPRESSO_TENANT: {{ .Values.espresso.tenant | quote }}
  ESPRESSO_INTERFACE: {{ .Values.espresso.interface | quote }}

  DB_TYPE: {{ .Values.db.type | quote }}
  POSTGRES_HOST: {{ .Values.db.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.db.postgres.port | quote }}
  POSTGRES_DATABASE: {{ .Values.db.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.db.postgres.user | quote }}
  POSTGRES_SSLMODE: {{ .Values.db.postgres.sslMode | quote }}
{{- if (.Values.db.postgres.sslRootCert.enabled | default false) }}
  POSTGRES_SSLROOTCERT: {{ include "espresso.postgresSslRootCertPath" . | quote }}
{{- end }}

  TEMPORAL_HOST: {{ include "espresso.temporalHost" . | quote }}
  TEMPORAL_PORT: {{ .Values.temporal.port | quote }}
{{- if (.Values.temporal.tls.enabled | default false) }}
  TEMPORAL_TLS_ENABLED: "true"
  TEMPORAL_TLS_SERVER_NAME: {{ include "espresso.temporalTlsServerName" . | quote }}
  ESPRESSO_TRUSTED_CA_DIR: {{ ((.Values.temporal.tls.ca.mountPath | default "/etc/espresso/trust") | trimSuffix "/") | quote }}
{{- else }}
  TEMPORAL_TLS_ENABLED: "false"
{{- end }}

  ESPRESSO_UI_API_HOST: espresso-backend
  ESPRESSO_UI_API_PORT: "8088"


{{- if eq .Values.espresso.interface "AZSB" }}
  BROKER_HOST: {{ required "azsb.host is required when espresso.interface=AZSB" .Values.azsb.host | quote }}
  BROKER_USER: {{ required "azsb.user is required when espresso.interface=AZSB" .Values.azsb.user | quote }}
  BROKER_TOPIC_ORDER: {{ required "azsb.topic.order is required when espresso.interface=AZSB" .Values.azsb.topic.order | quote }}
  BROKER_QUEUE_DELIVERY: {{ required "azsb.queue.delivery is required when espresso.interface=AZSB" .Values.azsb.queue.delivery | quote }}
  BROKER_QUEUE_RECEIPT: {{ required "azsb.queue.receipt is required when espresso.interface=AZSB" .Values.azsb.queue.receipt | quote }}
{{- end }}

{{- if .Values.espresso.sso.enabled }}
  AUTHORITY_URL: {{ required "espresso.sso.authorityUrl is required when espresso.sso.enabled=true" .Values.espresso.sso.authorityUrl | quote }}
  AUTHORITY_CLIENT_ID: {{ required "espresso.sso.clientId is required when espresso.sso.enabled=true" .Values.espresso.sso.clientId | quote }}
  AUTHORITY_CLIENT_REDIRECT_URI: {{ required "espresso.sso.redirectUri is required when espresso.sso.enabled=true" .Values.espresso.sso.redirectUri | quote }}
  AUTHORITY_CLIENT_POST_LOGOUT_REDIRECT_URI: {{ required "espresso.sso.postLogoutRedirectUri is required when espresso.sso.enabled=true" .Values.espresso.sso.postLogoutRedirectUri | quote }}
  AUTHORITY_CLIENT_SCOPE: {{ .Values.espresso.sso.scope | default "openid profile email" | quote }}

  AUTHORITY_DISCOVERY_ENABLED: {{ .Values.espresso.sso.discoveryEnabled | toString | quote }}
  AUTHORITY_REQUIRE_STATE: {{ .Values.espresso.sso.requireState | toString | quote }}
  AUTHORITY_ID_TOKEN_VALIDATION_REQUIRED: {{ .Values.espresso.sso.idTokenValidationRequired | toString | quote }}
  AUTHORITY_INTROSPECTION_ENABLED: {{ .Values.espresso.sso.introspectionEnabled | toString | quote }}

  AUTHORITY_USER_ID_CLAIM: {{ .Values.espresso.sso.userIdClaim | default "userid" | quote }}
  AUTHORITY_EMAIL_CLAIM: {{ .Values.espresso.sso.emailClaim | default "email" | quote }}
  AUTHORITY_NAME_CLAIM: {{ .Values.espresso.sso.nameClaim | default "name" | quote }}
  AUTHORITY_ROLE_CLAIM: {{ .Values.espresso.sso.roleClaim | default "role" | quote }}
  AUTHORITY_TENANT_CLAIM: {{ .Values.espresso.sso.tenantClaim | default "tenant" | quote }}

  AUTHORITY_ALLOWED_ROLES: {{ .Values.espresso.sso.allowedRoles | default "sysadmin,admin,operator,approver,observer" | quote }}
  AUTHORITY_LINK_EXISTING_USER_BY_USERID: {{ .Values.espresso.sso.linkExistingUserByUserid | toString | quote }}
{{- with .Values.espresso.sso.authorizationEndpoint }}
  AUTHORITY_AUTHORIZATION_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.espresso.sso.tokenEndpoint }}
  AUTHORITY_TOKEN_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.espresso.sso.introspectionEndpoint }}
  AUTHORITY_INTROSPECTION_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.espresso.sso.userInfoEndpoint }}
  AUTHORITY_USERINFO_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.espresso.sso.jwksEndpoint }}
  AUTHORITY_JWKS_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.espresso.sso.endSessionEndpoint }}
  AUTHORITY_END_SESSION_ENDPOINT: {{ . | quote }}
{{- end }}
{{- with .Values.espresso.sso.issuer }}
  AUTHORITY_ISSUER: {{ . | quote }}
{{- end }}
{{- end }}
