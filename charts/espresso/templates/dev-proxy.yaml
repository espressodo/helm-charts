{{- if not .Values.ingress.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-proxy-config
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
        listen 80;

        # 1. Backend-Routing
        # Leitet alle Anfragen an /api/v1/ direkt an das Backend weiter
        location /api/v1/ {
            proxy_pass http://espresso-backend:8088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Frontend-Routing
        # Leitet alles andere an das Frontend-Pod weiter
        location / {
            proxy_pass http://espresso-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Wichtig: Das Frontend-Pod selbst muss die SPA-Logik (index.html)
            # für React-Routes handhaben, nicht dieser Proxy hier.
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: espresso-dev-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: espresso-dev-proxy
  template:
    metadata:
      labels:
        app: espresso-dev-proxy
    spec:
      containers:
      - name: proxy
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: config
        configMap:
          name: dev-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: espresso-dev-proxy
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP # Oder NodePort, falls gewünscht
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: espresso-dev-proxy
{{- end }}