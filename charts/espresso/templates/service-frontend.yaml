apiVersion: v1
kind: Service
metadata:
  name: espresso-frontend
  labels:
    {{- include "espresso.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "espresso.selectorLabels" . | nindent 4 }}
    espresso: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
