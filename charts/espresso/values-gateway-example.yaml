# Example customer override for Gateway API exposure
# Usage:
#   helm upgrade --install espresso ./charts/espresso -f values-gateway-example.yaml

ingress:
  enabled: false

gateway:
  enabled: true
  host: espresso-dev.example.internal
  annotations: {}

  # Preferred form: pass the Gateway API parentRefs array directly.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: customer-shared-gateway
      namespace: infra-gateway
      sectionName: http

  # Backwards-compatible fields still work when parentRefs is empty:
  # name: customer-shared-gateway
  # namespace: infra-gateway
  # sectionName: http
