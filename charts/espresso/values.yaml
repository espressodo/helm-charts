# ============================================================================
# Espresso Data Privacy — Helm Chart Default Values (Vendor Neutral)
# ============================================================================
# This file defines the DEFAULT values shipped with the Espresso Helm chart.
#
# IMPORTANT PRINCIPLES
# 1) Vendor-neutral defaults:
#    - No customer-specific hostnames, URLs, client IDs, tenant codes, or
#      environment-specific identifiers are stored here.
#    - Customer-specific configuration must be provided via separate
#      customer values files (e.g. values_rest.yaml / values_azsb.yaml).
#
# 2) Secrets are never stored in values.yaml:
#    - Sensitive values (passwords, tokens, salts, signing keys) must be
#      provided via existing Kubernetes Secrets referenced by:
#        existingSecret + ...SecretKey
#
# 3) External dependencies:
#    - PostgreSQL is external (provided by customer or another chart).
#    - Temporal is external (provided by customer or another chart).
#
# 4) Access model:
#    - Default: port-forwarding (dev/minikube-friendly).
#    - Optional: Ingress (disabled by default).
# ============================================================================


# ----------------------------------------------------------------------------
# Container images
# ----------------------------------------------------------------------------
# Images are built as:
#   <images.espressoRepo>/<imageName>:<images.tag>
#
# Example:
#   espressoRepo: "myacr.azurecr.io/espresso"
#   tag: "1.7.0"
# will pull:
#   myacr.azurecr.io/espresso/<imageName>:1.7.0
images:
# Controls when the kubelet attempts to pull the specified image.
  # Using 'IfNotPresent' is ideal for local development (e.g. Minikube) 
  # to use locally loaded images and avoid unnecessary registry requests.
  pullPolicy: IfNotPresent
  
  # Docker repository / registry prefix hosting Espresso images.
  # Customers can override this to point to their own registry.
  espressoRepo: "espressodo"

  # Image tag used for all Espresso components.
  # Customers may pin this for reproducible deployments.
  tag: "1.7.0"

  # Optional list of Kubernetes imagePullSecret names for private registries.
  # Example:
  #   imagePullSecrets:
  #     - "my-registry-cred"
  imagePullSecrets: []


# ----------------------------------------------------------------------------
# ExternalSecret support (optional)
# ----------------------------------------------------------------------------
# When enabled, the chart renders an ExternalSecret resource for the
# External Secrets Operator. The operator then creates/syncs the Kubernetes
# Secret referenced by the normal existingSecret values below.
#
# The External Secrets Operator and CRDs must already be installed in the cluster.
externalSecret:
  enabled: false

  # How often the External Secrets Operator refreshes the generated Secret.
  refreshInterval: "1h0m0s"

  labels: {}
  annotations: {}

  # SecretStore or ClusterSecretStore reference.
  # Example:
  #   secretStoreRef:
  #     name: customer-secret-store
  #     kind: ClusterSecretStore
  secretStoreRef: {}

  # Name of the Kubernetes Secret created by the ExternalSecret.
  # Reference this same Secret from db.postgres.existingSecret,
  # espresso.uiBackend.existingSecret, espresso.sso.existingSecret, etc.
  targetSecretName: ""

  # Map individual remote secret properties to Kubernetes Secret keys.
  data: []
    # - secretKey: POSTGRES_PASSWORD
    #   remoteRef:
    #     key: espresso/postgres
    #     property: password
    # - secretKey: ESPRESSO_UI_API_PASSWORD_SALT
    #   remoteRef:
    #     key: espresso/ui-backend
    #     property: passwordSalt
    # - secretKey: ESPRESSO_UI_API_PRIVATE_KEY
    #   remoteRef:
    #     key: espresso/ui-backend
    #     property: privateKey

  # Optional: import/extract complete remote secret objects.
  dataFrom: []
    # - extract:
    #     key: espresso/all


# ----------------------------------------------------------------------------
# Espresso application configuration
# ----------------------------------------------------------------------------
espresso:

  # --------------------------------------------------------------------------
  # Tenant identifier
  # --------------------------------------------------------------------------
  # Tenant code used by Espresso for multi-tenant separation.
  # Expected format: EXACTLY 3 uppercase letters (e.g. "ABC").
  #
  # Vendor default is empty to avoid shipping customer-specific values.
  # Customers MUST set this in their customer values file.
  tenant: ""

  # --------------------------------------------------------------------------
  # Interface mode (runtime integration style)
  # --------------------------------------------------------------------------
  # Supported modes:
  # - "REST": HTTP-based integration (REST endpoints)
  # - "AZSB": Azure Service Bus integration
  #
  # Vendor default is "REST" because it requires fewer external parameters.
  interface: "REST"

  # --------------------------------------------------------------------------
  # Delivery worker configuration
  # --------------------------------------------------------------------------
  workerBatchPost:
    # Leave empty to keep retention-period validation enabled (default behavior).
    # Set to "disable" to render:
    # ESPRESSO_RETENTION_PERIOD_VALIDATION=disable
    retentionPeriodValidation: ""


  # --------------------------------------------------------------------------
  # UI Frontend configuration
  # --------------------------------------------------------------------------
  uiFrontend:
    # Base path used by the UI frontend to reach the UI backend.
    # Default "/api/v1" matches the chart's routing conventions.
    #
    # NOTE:
    # - When ingress is enabled, customers typically route /api/v1/* to the
    #   backend/gateway service.
    uiBackend: "/api/v1"


  # --------------------------------------------------------------------------
  # UI Backend configuration
  # --------------------------------------------------------------------------
  uiBackend:
    # ------------------------------------------------------------------------
    # Sensitive values via existing Kubernetes Secret
    # ------------------------------------------------------------------------
    # Sensitive values MUST NOT be stored in values.yaml.
    # Provide them via an existing Kubernetes Secret in the same namespace.
    #
    # existingSecret:
    #   Name of the Kubernetes Secret that contains UI backend sensitive keys.
    existingSecret: ""

    # passwordSaltSecretKey:
    #   Key name inside *existingSecret* that contains the password salt string.
    #
    # IMPORTANT:
    # - This value MUST remain stable across upgrades.
    # - Changing the salt can invalidate default/precomputed users/passwords
    #   stored in the database (depending on your implementation).
    passwordSaltSecretKey: "ESPRESSO_UI_API_PASSWORD_SALT"

    # privateKeySecretKey:
    #   Key name inside *existingSecret* that contains the OIDC/JWT signing key.
    #
    # IMPORTANT:
    # - This value MUST remain stable across upgrades unless you have a planned
    #   key-rotation strategy (multiple keys / kid / overlap window).
    # - Changing this key can invalidate already issued tokens.
    privateKeySecretKey: "ESPRESSO_UI_API_PRIVATE_KEY"

    # ------------------------------------------------------------------------
    # Authentication / runtime behavior
    # ------------------------------------------------------------------------
    # loginMode:
    #   Authentication mode for the UI backend.
    #   Allowed values:
    #     - "manual": local/manual login
    #     - "oidc": OIDC login with an existing local/SCIM-provisioned user
    #     - "sso": legacy alias for "oidc"
    #     - "oidc-only": OIDC login with JIT user provisioning, without SCIM
    loginMode: "manual"

    # postTaskUrl:
    #   REST endpoint URL used by the UI backend to submit tasks.
    #   Vendor default targets the in-cluster espresso-api service.
    postTaskUrl: "http://espresso-api:8097"


  # --------------------------------------------------------------------------
  # SCIM configuration (optional)
  # --------------------------------------------------------------------------
  scim:
    # Enable/disable SCIM server integration.
    enabled: false

    # existingSecret:
    #   Name of the Kubernetes Secret containing the SCIM API token.
    existingSecret: ""

    # apiTokenSecretKey:
    #   Key name inside *existingSecret* that contains the SCIM API token string.
    apiTokenSecretKey: "ESPRESSO_API_TOKEN"


  # --------------------------------------------------------------------------
  # SSO / OIDC configuration (optional)
  # --------------------------------------------------------------------------
  sso:
    # Enable/disable SSO (OIDC) integration.
    enabled: false

    # authorityUrl:
    #   OIDC authority/issuer base URL (IdP endpoint).
    #   Example (customer-specific): "https://login.example.com/realms/<realm>"
    authorityUrl: ""

    # clientId:
    #   OIDC client ID (NOT a secret).
    clientId: ""

    # Client secret handling:
    # Only the OIDC client secret is sensitive. All other SSO fields are
    # non-secret configuration and are rendered via ConfigMap.
    #
    # existingSecret:
    #   Name of the Kubernetes Secret that contains the OIDC client secret.
    existingSecret: ""

    # clientSecretSecretKey:
    #   Key name inside *existingSecret* that contains the OIDC client secret.
    clientSecretSecretKey: "AUTHORITY_CLIENT_SECRET"

    # redirectUri:
    #   Redirect URI registered at the IdP for login callbacks.
    redirectUri: ""

    # postLogoutRedirectUri:
    #   Redirect URI registered at the IdP for logout callbacks.
    postLogoutRedirectUri: ""

    # scope:
    #   OIDC scopes to request.
    scope: "openid profile email"

    # ------------------------------------------------------------------------
    # OIDC flow/security options (Espresso 1.7)
    # ------------------------------------------------------------------------
    # discoveryEnabled:
    #   Enables OIDC discovery via .well-known/openid-configuration.
    discoveryEnabled: true

    # requireState:
    #   Requires and validates the state parameter on callback.
    requireState: true

    # idTokenValidationRequired:
    #   Validates the ID token using JWKS/signature, issuer, audience, expiry and nonce.
    idTokenValidationRequired: true

    # introspectionEnabled:
    #   Enables access token introspection for legacy providers.
    #   Default is false because the new flow validates the ID token.
    introspectionEnabled: false

    # ------------------------------------------------------------------------
    # OIDC claim mapping defaults (Espresso 1.7)
    # ------------------------------------------------------------------------
    # userIdClaim:
    #   Claim used as internal Espresso userid.
    #   Default: "userid". Customers can set "sub" when the full subject value
    #   must be used as the local userid.
    userIdClaim: "userid"

    emailClaim: "email"
    nameClaim: "name"
    roleClaim: "role"
    tenantClaim: "tenant"

    # allowedRoles:
    #   Optional whitelist of valid Espresso roles. Recommended for oidc-only.
    allowedRoles: "sysadmin,admin,operator,approver,observer"

    # linkExistingUserByUserid:
    #   Allows controlled linking of an existing local user without externalid
    #   by userid in oidc-only mode. Secure default is false.
    linkExistingUserByUserid: false

    # ------------------------------------------------------------------------
    # Optional explicit OIDC endpoint overrides
    # ------------------------------------------------------------------------
    # When set, these override discovery and legacy AUTHORITY_URL fallback.
    authorizationEndpoint: ""
    tokenEndpoint: ""
    introspectionEndpoint: ""
    userInfoEndpoint: ""
    jwksEndpoint: ""
    endSessionEndpoint: ""
    issuer: ""


# ----------------------------------------------------------------------------
# Database configuration (external PostgreSQL)
# ----------------------------------------------------------------------------
db:
  # Database type supported by this chart.
  type: "postgres"

  postgres:
    # host:
    #   PostgreSQL hostname or Kubernetes Service DNS name.
    #   Customer must provide a value.
    host: ""

    # port:
    #   PostgreSQL port.
    port: 5432

    # database:
    #   Database name to connect to.
    database: ""

    # user:
    #   Database user name.
    user: ""

    # existingSecret:
    #   Name of the Kubernetes Secret that contains the database password.
    existingSecret: ""

    # passwordSecretKey:
    #   Key name inside *existingSecret* that contains the database password.
    passwordSecretKey: "POSTGRES_PASSWORD"

    # sslMode:
    #   PostgreSQL SSL mode.
    #   Supported common values: "disable", "require", "verify-ca", "verify-full".
    #   For production with server certificate validation use "verify-full"
    #   together with sslRootCert.enabled=true.
    sslMode: "require"

    # sslRootCert:
    #   Optional PostgreSQL CA trust anchor mounted from an existing Secret.
    #   Enable this when POSTGRES_SSLMODE is "verify-ca" or "verify-full".
    #
    #   The Secret must already exist in the release namespace and contain the
    #   CA certificate under secretKey, for example:
    #     kubectl create secret generic espresso-postgres-ca --from-file=ca.crt=./ca.crt
    sslRootCert:
      enabled: false
      existingSecret: ""
      secretKey: "ca.crt"
      mountPath: "/etc/espresso/postgres-trust"
      fileName: "ca.crt"


# ----------------------------------------------------------------------------
# Temporal configuration (external)
# ----------------------------------------------------------------------------
temporal:
  # host:
  #   Temporal Frontend Service name, Kubernetes DNS name, or external hostname.
  #   When temporal.kubernetesNamespace is set and host is a short service name,
  #   the chart renders TEMPORAL_HOST as <host>.<kubernetesNamespace>.svc.
  host: "temporal-frontend"

  # kubernetesNamespace:
  #   Kubernetes namespace where the Temporal Frontend Service runs.
  #   Leave empty when Temporal is deployed in the same Kubernetes namespace
  #   as Espresso, or when temporal.host is already a fully qualified DNS name.
  kubernetesNamespace: ""

  # port:
  #   Temporal Frontend port.
  port: 7233

  # tls:
  #   Optional TLS for all Espresso clients connecting to Temporal.
  #   CA material is supplied at runtime through an existing Kubernetes Secret.
  #   No customer certificate is baked into the Espresso images.
  tls:
    enabled: false

    # serverName:
    #   Name used for TLS certificate hostname verification.
    #   Leave empty to default to the effective Temporal host.
    serverName: ""

    ca:
      # existingSecret:
      #   Existing Secret containing the Temporal CA certificate.
      #   Example:
      #     kubectl create secret generic espresso-temporal-ca --from-file=ca.crt=./ca.crt
      existingSecret: ""
      secretKey: "ca.crt"
      mountPath: "/etc/espresso/trust"
      fileName: "ca.crt"


# ----------------------------------------------------------------------------
# Initialization jobs (Helm hook)
# ----------------------------------------------------------------------------
init:
  # When enabled, the chart runs an init job as a Helm hook (pre-install, pre-upgrade)
  # to bootstrap required resources such as DB schema and/or Temporal namespace.
  enabled: true

  # postgresSchema:
  #   If true, creates/updates the PostgreSQL schema needed by Espresso.
  postgresSchema: true

  # temporalNamespace:
  #   If true, creates the Temporal namespace used by Espresso.
  temporalNamespace: true

  # temporalAdminToolsImage:
  #   Container image used for Temporal administration (tctl).
  temporalAdminToolsImage: temporalio/admin-tools:1.29.1-tctl-1.18.4-cli-1.5.0


# ----------------------------------------------------------------------------
# Database migration jobs
# ----------------------------------------------------------------------------
dbMigration:
  # enabled:
  #   Runs the idempotent Espresso database migration needed when upgrading
  #   Espresso from 1.6.0 to 1.7.0.
  #   The migration is rendered as a Helm pre-upgrade hook so it can be
  #   executed by Helm/GitOps before the application pods are updated.
  enabled: true

  # fromVersion:
  #   Source Espresso version for this migration. The job is rendered only for
  #   upgrades from 1.6.0 to 1.7.0.
  fromVersion: "1.6.0"

  # targetVersion:
  #   Target Espresso version for this migration.
  targetVersion: "1.7.0"

  image:
    # Uses the official PostgreSQL image only for the psql client.
    repository: "postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # hookWeight:
  #   Hook weight for GitOps/Helm hook ordering.
  hookWeight: "-10"

  # hookDeletePolicy:
  #   Deletes successful hook jobs and recreates them on the next upgrade.
  hookDeletePolicy: "before-hook-creation,hook-succeeded"

  # extraAnnotations:
  #   Optional extra annotations for GitOps controllers.
  #   Example for Argo CD if your setup does not rely on Helm hook mapping:
  #     argocd.argoproj.io/hook: PreSync
  #     argocd.argoproj.io/sync-wave: "-10"
  extraAnnotations: {}

  backoffLimit: 1


# ----------------------------------------------------------------------------
# Azure Service Bus configuration (only if espresso.interface="AZSB")
# ----------------------------------------------------------------------------
azsb:
  # host:
  #   Azure Service Bus namespace host, e.g. "your.servicebus.windows.net"
  host: ""

  # user:
  #   Username / SAS key name, e.g. "RootManageSharedAccessKey"
  user: ""

  # existingSecret:
  #   Name of the Kubernetes Secret that contains the Service Bus password/key.
  existingSecret: ""

  # passwordSecretKey:
  #   Key name inside *existingSecret* that contains the Service Bus password/key.
  passwordSecretKey: "BROKER_PASSWORD"

  # topic configuration
  topic:
    # order:
    #   Topic name used for orders.
    order: ""

  # queue configuration
  queue:
    # delivery:
    #   Queue name used for deliveries.
    delivery: ""
    # receipt:
    #   Queue name used for receipts.
    receipt: ""


# ----------------------------------------------------------------------------
# Ingress API exposure (optional)
# ----------------------------------------------------------------------------
ingress:
  # Enable/disable Ingress resources.
  # Mutually exclusive with gateway.enabled.
  enabled: false

  # className:
  #   IngressClass to use (commonly "nginx").
  className: "nginx"

  # host:
  #   Hostname used in the ingress rule (when ingress is enabled).
  #
  # Vendor default is empty to avoid shipping customer-specific values.
  host: ""

  # annotations:
  #   Additional annotations for your ingress controller.
  annotations: {}


# ----------------------------------------------------------------------------
# Gateway API exposure (optional)
# ----------------------------------------------------------------------------
gateway:
  # Enable/disable Gateway API HTTPRoute resources.
  # Mutually exclusive with ingress.enabled.
  enabled: false

  # parentRefs:
  #   Optional explicit list of Gateway API parentRefs for the HTTPRoute.
  #   When this list is empty, the backwards-compatible single parentRef below
  #   is rendered from gateway.name / namespace / sectionName.
  #
  # Example:
  #   parentRefs:
  #     - group: gateway.networking.k8s.io
  #       kind: Gateway
  #       name: shared-gateway
  #       namespace: infra-gateway
  #       sectionName: http
  #       # port: 80
  parentRefs: []

  # name:
  #   Backwards-compatible single Gateway name. Used only when parentRefs is empty.
  name: ""

  # namespace:
  #   Backwards-compatible single Gateway namespace. Used only when parentRefs is empty.
  #   Leave empty when the Gateway is in the same namespace as this release.
  namespace: ""

  # sectionName:
  #   Backwards-compatible listener name. Used only when parentRefs is empty.
  sectionName: ""

  # host:
  #   Hostname used by the HTTPRoute when gateway is enabled.
  host: ""

  # annotations:
  #   Additional annotations for the HTTPRoute resource.
  annotations: {}
